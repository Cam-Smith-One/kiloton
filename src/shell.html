<meta charset="utf-8">
<title>Kiloton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* single committed look: a dusk-lit instrument panel. Layout: one full-bleed canvas, HUD layered above. */
:root{--kt-bg:#0b0d10;--kt-ink:#e9e4d8;--kt-dim:#8b9099;--kt-cyan:#49e0d2;--kt-amber:#ffb23e;--kt-red:#ff4b3a;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--kt-bg);color:var(--kt-ink);overflow:hidden}
#kt-root{position:fixed;inset:0;overflow:hidden;background:var(--kt-bg);user-select:none;-webkit-user-select:none}
#kt-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#kt-ui{position:absolute;inset:0;pointer-events:none}
#kt-load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:var(--kt-bg);z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .6s ease}
#kt-load.done{opacity:0;pointer-events:none}
#kt-load b{font:800 clamp(34px,7vw,72px)/1 "Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.34em;margin-right:-.34em;color:var(--kt-ink)}
#kt-load em{font:italic 500 clamp(13px,1.6vw,17px)/1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:var(--kt-amber);margin-top:-6px}
#kt-load u{display:block;width:min(360px,70vw);height:2px;background:#ffffff1c;text-decoration:none;overflow:hidden}
#kt-load i{display:block;height:100%;background:var(--kt-cyan);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
#kt-load span{font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--kt-dim)}
@media (prefers-reduced-motion:reduce){#kt-load,#kt-load i{transition:none}}
</style>
<div id="kt-root"><canvas id="kt-canvas" tabindex="0"></canvas><div id="kt-ui"></div>
<div id="kt-load"><b>KILOTON</b><em>A game design by Cam Smith</em><u><i></i></u><span>Pouring concrete</span></div></div>
<script>/*__BUNDLE__*/</script>
